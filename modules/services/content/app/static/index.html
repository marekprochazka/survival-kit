<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 60rem; margin: 0 auto; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: .8rem 1rem; margin-bottom: .9rem; }
    h2 { margin: 0 0 .3rem; font-size: 1.15rem; }
    .where { margin: 0 0 .5rem; color: var(--muted); font-size: .85rem; font-family: monospace; }
    table { width: 100%; border-collapse: collapse; margin-bottom: .6rem; }
    th, td { text-align: left; padding: .25rem .4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: normal; font-size: .85rem; }
    tr.builtin { color: var(--muted); }
    button { font: inherit; padding: .15rem .6rem; }
    label { margin-right: 1rem; }
    progress { width: 100%; }
    #log:empty { display: none; }
    #log p { margin: .2rem 0; }
    .error { color: var(--down); }
  </style>
</head>
