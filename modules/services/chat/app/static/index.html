<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 0; }
    .app { display: grid; grid-template-columns: 16rem 1fr; height: 100vh; }
    aside { border-right: 1px solid var(--border); padding: .8rem; overflow-y: auto; background: var(--card); }
    aside button.new { width: 100%; margin-bottom: .8rem; }
    .chat-item { display: block; width: 100%; text-align: left; padding: .4rem .5rem; border: 0;
      border-radius: 6px; background: none; color: inherit; font: inherit; cursor: pointer; }
    .chat-item:hover, .chat-item[aria-current="true"] { background: var(--bg); }
    .chat-item small { display: block; color: var(--muted); }
    main { display: flex; flex-direction: column; min-width: 0; }
    .bar { display: flex; gap: .6rem; align-items: center; justify-content: space-between;
      padding: .6rem 1rem; border-bottom: 1px solid var(--border); }
    .bar h1 { font-size: 1.1rem; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem; }
    .msg { max-width: 46rem; margin: 0 0 .9rem; padding: .6rem .8rem; border-radius: 8px;
      white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { margin-left: auto; background: var(--card); border: 1px solid var(--border); }
    .assistant { background: var(--card); border: 1px solid var(--border); }
    .notice { border-left: 4px solid var(--down); }
    .sources { margin-top: .5rem; font-size: .88rem; color: var(--muted); white-space: normal; }
    .sources a { color: var(--accent); margin-right: .6rem; }
    .status { color: var(--muted); font-size: .88rem; margin: 0 0 .3rem; }
    .error { color: var(--down); }
    form { display: flex; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid var(--border); }
    textarea { flex: 1; font: inherit; padding: .4rem; resize: vertical; min-height: 2.6rem; }
    button { font: inherit; padding: .3rem .8rem; }
    .empty { color: var(--muted); }
    @media (max-width: 42rem) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 30vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <button class="new" id="new">New chat</button>
      <nav id="chats" aria-label="Chats"></nav>
    </aside>
    <main>
      <div class="bar">
        <h1 id="title">Chat</h1>
        <span>
          <label>Model <select id="model"></select></label>
          <button id="rename" hidden>Rename</button>
          <button id="delete" hidden>Delete</button>
        </span>
      </div>
      <section id="messages" aria-live="polite">
        <p class="empty">Ask anything. The box looks in its wiki first and shows where the answer comes from.
          Answers take a while on this computer — you can close the page and come back.</p>
      </section>
      <form id="ask">
        <textarea id="question" rows="2" placeholder="Ask something…" required></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="chat.js"></script>
</body>
</html>
