# CI per ADR-0003: fast checks on every push/PR.
# VM tests + install test are local-only: `nix flake check` runs everything.
name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Static checks (nixfmt, statix, deadnix)
        run: nix build .#checks.x86_64-linux.lint --print-build-logs
      - name: Eval assertions
        run: nix build .#checks.x86_64-linux.eval-disk --print-build-logs
